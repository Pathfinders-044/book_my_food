<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book My Food</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6ef;--surface:#ffffff;--ink:#17261e;--muted:#5d6f64;--line:#d8e2d6;--green:#1f6b4a;--green-ink:#ffffff;--chili:#c8372d;--turmeric:#f0b429;--turmeric-ink:#3a2a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a15;--surface:#182620;--ink:#eaf2ec;--muted:#9bb0a3;--line:#2a3d33;--green:#4fb98a;--green-ink:#06210f;--chili:#ff7a6e;--turmeric:#f0b429;--turmeric-ink:#3a2a00;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101a15;--surface:#182620;--ink:#eaf2ec;--muted:#9bb0a3;--line:#2a3d33;--green:#4fb98a;--green-ink:#06210f;--chili:#ff7a6e;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:460px;margin:0 auto;min-height:100vh;padding:0 16px 120px}
h1,h2,.brand{font-family:"Baloo 2",system-ui,sans-serif;margin:0}
header{padding:22px 0 8px}
.brand{font-size:30px;font-weight:800;letter-spacing:-.3px;line-height:1.1}
.brand span{color:var(--chili)}
.sub{color:var(--muted);margin:2px 0 0;font-size:14px}
.tabs{display:flex;gap:8px;margin:14px 0 6px}
.tab{flex:1;padding:11px 8px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;font-weight:600;font-size:15px;font-family:inherit;cursor:pointer}
.tab[aria-selected="true"]{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.list{list-style:none;margin:8px 0 0;padding:0;background:var(--surface);border-radius:16px;border:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;padding:14px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .nm{flex:1;font-weight:600}
.item .pr{color:var(--muted);font-size:14px;display:block;font-weight:400}
.add{padding:8px 18px;border-radius:10px;border:2px solid var(--green);background:transparent;color:var(--green);font-weight:700;font-size:14px;font-family:inherit;cursor:pointer}
.step{display:flex;align-items:center;background:var(--green);border-radius:10px;color:var(--green-ink)}
.step button{width:36px;height:36px;border:0;background:transparent;color:inherit;font-size:20px;cursor:pointer}
.step b{min-width:22px;text-align:center}
button:focus-visible{outline:3px solid var(--turmeric);outline-offset:2px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.bar .in{max-width:460px;margin:0 auto}
.cta{width:100%;display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border:0;border-radius:14px;background:var(--chili);color:#fff;font-weight:700;font-size:17px;font-family:inherit;cursor:pointer}
.cta[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--green);font-weight:600;font-size:15px;font-family:inherit;padding:10px 0;cursor:pointer}
h2{font-size:24px;margin:18px 0 6px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line)}
.total{font-weight:800;font-size:18px;border-bottom:0}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.pay button{padding:12px 4px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;font-family:inherit;cursor:pointer}
.pay button[aria-pressed="true"]{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.ticket{margin:18px 0;background:var(--turmeric);color:var(--turmeric-ink);border-radius:18px;padding:22px 18px;text-align:center;position:relative}
.ticket:before,.ticket:after{content:"";position:absolute;top:62%;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.ticket:before{left:-11px}.ticket:after{right:-11px}
.ticket .lbl{font-size:14px;font-weight:600}
.ticket .num{font-family:"Baloo 2",system-ui,sans-serif;font-size:76px;font-weight:800;line-height:1;margin:2px 0 14px}
.ticket .dash{border-top:2px dashed rgba(58,42,0,.45);padding-top:12px;font-size:14px}
.status{display:flex;margin:6px 0 4px}
.st{flex:1;text-align:center;font-size:14px;color:var(--muted);position:relative;padding-top:26px}
.st:before{content:"";position:absolute;top:4px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--line);z-index:1}
.st:after{content:"";position:absolute;top:11px;left:-50%;width:100%;height:3px;background:var(--line)}
.st:first-child:after{display:none}
.st.on{color:var(--ink);font-weight:700}
.st.on:before,.st.on:after{background:var(--green)}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.note{color:var(--muted);font-size:13px;text-align:center;margin-top:18px}
@media (prefers-reduced-motion:no-preference){.ticket{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.94);opacity:.4}}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="bar" id="bar" hidden><div class="in" id="barin"></div></div>
<script>
var MENU={
  morning:[["Onion dosa",30],["Puri",25],["Plain dosa",20],["Masala dosa",30],["Mysore bajji",25],["Idli",20]],
  later:[["Fried rice",60],["Noodles",60],["Fry biryani",120],["Dum biryani",150],["Special biryani",150],["Special fried rice",100]]
};
var s={tab:"morning",cart:{},screen:"menu",pay:"UPI",token:null,stage:0,seq:24,timers:[]};
var app=document.getElementById("app"),bar=document.getElementById("bar"),barin=document.getElementById("barin");
function key(t,i){return t+":"+i}
function lines(){var out=[];for(var t in MENU)MENU[t].forEach(function(m,i){var q=s.cart[key(t,i)]||0;if(q)out.push({n:m[0],p:m[1],q:q,k:key(t,i)})});return out}
function totals(){var c=0,a=0;lines().forEach(function(l){c+=l.q;a+=l.q*l.p});return{c:c,a:a}}
function setQ(k,d){s.cart[k]=Math.max(0,(s.cart[k]||0)+d);render()}
function go(x){s.screen=x;window.scrollTo(0,0);render()}
function head(sub){return '<header><div class="brand">Book My <span>Food</span></div><p class="sub">'+sub+'</p></header>'}
function render(){
  var t=totals(),h="";
  if(s.screen==="menu"){
    h=head("Order now, collect when it’s ready.")+
    '<div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="morning" aria-selected="'+(s.tab==="morning")+'">Morning</button><button class="tab" role="tab" data-tab="later" aria-selected="'+(s.tab==="later")+'">Afternoon &amp; night</button></div><ul class="list">';
    MENU[s.tab].forEach(function(m,i){var k=key(s.tab,i),q=s.cart[k]||0;
      h+='<li class="item"><div class="nm">'+m[0]+'<span class="pr">₹'+m[1]+'</span></div>'+
      (q?'<div class="step"><button data-d="-1" data-k="'+k+'" aria-label="Remove one '+m[0]+'">−</button><b>'+q+'</b><button data-d="1" data-k="'+k+'" aria-label="Add one '+m[0]+'">+</button></div>':'<button class="add" data-d="1" data-k="'+k+'">Add</button>')+'</li>'});
    h+='</ul>';
    bar.hidden=!t.c;
    barin.innerHTML='<button class="cta" data-go="summary"><span>'+t.c+(t.c===1?' item':' items')+'</span><span>View order · ₹'+t.a+'</span></button>';
  }else if(s.screen==="summary"){
    h=head("Check your order")+'<h2>Your order</h2>';
    lines().forEach(function(l){h+='<div class="row"><span>'+l.n+' × '+l.q+'</span><span>₹'+l.p*l.q+'</span></div>'});
    h+='<div class="row total"><span>Total</span><span>₹'+t.a+'</span></div><h2>Pay with</h2><div class="pay">';
    ["UPI","Card","Cash"].forEach(function(p){h+='<button data-pay="'+p+'" aria-pressed="'+(s.pay===p)+'">'+p+'</button>'});
    h+='</div><button class="link" data-go="menu">Back to menu</button>';
    bar.hidden=false;
    barin.innerHTML='<button class="cta" id="place"><span>Place order</span><span>₹'+t.a+'</span></button>';
  }else{
    var st=["Placed","Preparing","Ready"];
    h=head("Order confirmed")+'<div class="ticket"><div class="lbl">Your token</div><div class="num">A-0'+s.token+'</div><div class="dash">'+t.c+(t.c===1?' item':' items')+' · ₹'+t.a+' · '+s.pay+'</div></div><div class="status" aria-live="polite">';
    st.forEach(function(x,i){h+='<div class="st'+(i<=s.stage?' on':'')+'">'+x+'</div>'});
    h+='</div><div class="msg">'+(s.stage===2?'<b>Your food is ready.</b> Show token A-0'+s.token+' at the counter.':s.stage===1?'The kitchen is preparing your order.':'We’ve got your order. The kitchen will start soon.')+'</div>';
    bar.hidden=false;
    barin.innerHTML='<button class="cta" data-go="new" '+(s.stage<2?'disabled':'')+'><span>'+(s.stage<2?'Waiting for pickup':'Collected, order again')+'</span></button>';
    h+='<p class="note">Prototype demo. The status updates itself every few seconds.</p>';
  }
  app.innerHTML=h;
}
function clearT(){s.timers.forEach(clearTimeout);s.timers=[]}
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.tab){s.tab=b.dataset.tab;render()}
  else if(b.dataset.d){setQ(b.dataset.k,+b.dataset.d)}
  else if(b.dataset.pay){s.pay=b.dataset.pay;render()}
  else if(b.id==="place"){s.seq++;s.token=s.seq;s.stage=0;go("token");
    clearT();s.timers.push(setTimeout(function(){s.stage=1;render()},4000),setTimeout(function(){s.stage=2;render()},9000))}
  else if(b.dataset.go==="new"){clearT();s.cart={};s.stage=0;go("menu")}
  else if(b.dataset.go){go(b.dataset.go)}
});
render();
</script>
</body>
</html>
